<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Mahasiswa</title>

    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold">Form Input Mahasiswa</h2>

            <form method="POST" class="row g-3">
                {% csrf_token %}

                <div class="col-md-6">
                    <label class="form-label">Nama:</label>
                    <input type="text" name="nama" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">NPM:</label>
                    <input type="text" name="npm" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="col-md-12">
                    <label class="form-label">Alamat:</label>
                    <textarea name="alamat" class="form-control" required></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Jurusan:</label>
                    <input type="text" name="jurusan" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">No HP:</label>
                    <input type="text" name="nohp" class="form-control" required>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary px-4">Kirim</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card mt-5 shadow-sm">
        <div class="card-body">
            <h3 class="fw-bold mb-3">Daftar Mahasiswa</h3>

            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>NPM</th>
                        <th>Email</th>
                        <th>Alamat</th>
                        <th>Jurusan</th>
                        <th>No HP</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody>
                    {% for m in data %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ m.nama }}</td>
                        <td>{{ m.npm }}</td>
                        <td>{{ m.email }}</td>
                        <td>{{ m.alamat }}</td>
                        <td>{{ m.jurusan }}</td>
                        <td>{{ m.nohp }}</td>

                        <td>
                            <a href="{% url 'edit_mahasiswa' m.id %}" class="btn btn-warning btn-sm">Edit</a>
                            <a href="{% url 'delete_mahasiswa' m.id %}" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="8" class="text-center">Belum ada data.</td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
